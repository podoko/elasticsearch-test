fos_elastica:
    clients:
        default:
            host: '%env(ELASTICSEARCH_HOST)%'
            port: '%env(int:ELASTICSEARCH_PORT)%'
            logger: false

    indexes:
        posts:
            # No 'persistence' block (no Doctrine) — documents are pushed
            # directly via the Elastica client.
            properties:
                title:
                    type: text
                status:
                    type: keyword
                body:
                    type: text
        articles:
            properties:
                title:
                    type: text
                content:
                    type: text
                category:
                    type: keyword
                tags:
                    type: keyword
                author:
                    type: keyword
                publishedAt:
                    type: date
                views:
                    type: integer
