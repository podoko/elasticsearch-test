fos_elastica:
    clients:
        default:
            host: '%env(ELASTICSEARCH_HOST)%'
            port: '%env(int:ELASTICSEARCH_PORT)%'
            logger: false

    indexes:
        posts:
            # Pas de bloc 'persistence' (pas de Doctrine) — les documents sont
            # poussés directement via le client Elastica.
            properties:
                title:
                    type: text
                status:
                    type: keyword
                body:
                    type: text
        articles:
            properties:
                title:
                    type: text
                content:
                    type: text
                category:
                    type: keyword
                tags:
                    type: keyword
                author:
                    type: keyword
                publishedAt:
                    type: date
                views:
                    type: integer
